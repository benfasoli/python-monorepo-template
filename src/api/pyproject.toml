[project]
name = "api"
version = "0.0.0"
requires-python = "~=3.14.0"
dependencies = [
    "core",
    "fastapi ~= 0.140",
    "pydantic ~= 2.13",
    "uvicorn ~= 0.51",
]

[dependency-groups]
dev = ["httpx2 ~= 2.9"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
